name: Diagnosticar referência da VPS

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Referência exibida ao usuário
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    name: Localizar erro sanitizado
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar registro da aplicação
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$REQUEST_ID" =~ ^[a-f0-9]{32}$ ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/mundointer"
          chmod 600 "$HOME/.ssh/mundointer"
          ssh -i "$HOME/.ssh/mundointer" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 deploy@15.204.121.10 "REQUEST_ID=$REQUEST_ID bash -se" <<'REMOTE'
          set -euo pipefail
          log_dir=/var/www/painel-inter/storage/logs
          match="$(grep -h -F "$REQUEST_ID" "$log_dir"/*.log 2>/dev/null | tail -n 1 || true)"
          if [ -z "$match" ]; then
            echo "::error::Referência não encontrada nos registros atuais."
            exit 1
          fi
          printf '%s\n' "$match"
          REMOTE
