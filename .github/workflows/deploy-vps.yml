name: Publicar na VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Atualizar Mundo Inter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Atualizar aplicação na VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/mundointer"
          chmod 600 "$HOME/.ssh/mundointer"

          ssh \
            -i "$HOME/.ssh/mundointer" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            deploy@15.204.121.10 'bash -se' <<'REMOTE'
          set -euo pipefail

          repo=/var/www/painel-inter
          test -d "$repo/.git"
          before="$(git -C "$repo" rev-parse --short HEAD)"

          git -C "$repo" fetch origin main
          git -C "$repo" pull --ff-only origin main
          composer --working-dir="$repo" dump-autoload --classmap-authoritative
          php "$repo/bin/console" migrate
          composer --working-dir="$repo" check

          # O robô LTI MASTER usa um Chromium isolado para concluir o Deep
          # Linking sem depender de uma sessão manual no Moodle. Mantemos o
          # pacote e o navegador instalados dentro da própria aplicação, para
          # que o usuário web e o usuário de deploy compartilhem o executável.
          if [ -f "$repo/automation/package.json" ]; then
            npm --prefix "$repo/automation" install --omit=dev --no-audit --no-fund
            PLAYWRIGHT_BROWSERS_PATH="$repo/automation/.playwright-browsers" \
              "$repo/automation/node_modules/.bin/playwright" install chromium
            chmod -R a+rX "$repo/automation/.playwright-browsers"
          fi

          # A publicação LTI pode levar alguns minutos. Ela roda fora da
          # requisição web para não depender do limite de espera do Cloudflare.
          cron_line="* * * * * cd $repo && php bin/console ava-courses:process 2 >> /tmp/mundointer-ava-course-worker.log 2>&1"
          (crontab -l 2>/dev/null | grep -Fv 'bin/console ava-courses:process' || true; echo "$cron_line") | crontab -

          after="$(git -C "$repo" rev-parse --short HEAD)"
          echo "Publicação concluída: $before -> $after"
          REMOTE
