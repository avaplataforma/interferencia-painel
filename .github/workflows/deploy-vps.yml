name: Publicar na VPS


on:
  push:
    branches:
      - main
  workflow_dispatch:


concurrency:
  group: production-vps
  cancel-in-progress: false


jobs:
  deploy:
    name: Atualizar Mundo Inter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Atualizar aplicação na VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/mundointer"
          chmod 600 "$HOME/.ssh/mundointer"


          ssh \
            -i "$HOME/.ssh/mundointer" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            deploy@15.204.121.10 'bash -s' <<'REMOTE'
          set -euo pipefail


          repo=''
          for candidate in \
            /home/*/web/*/private/interferencia-painel \
