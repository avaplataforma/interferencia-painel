name: Publicar na VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Atualizar Mundo Inter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Atualizar aplicação na VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/mundointer"
          chmod 600 "$HOME/.ssh/mundointer"

          ssh \
            -i "$HOME/.ssh/mundointer" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            deploy@15.204.121.10 'bash -se' <<'REMOTE'
          set -euo pipefail

          repo=/var/www/painel-inter
          test -d "$repo/.git"
          before="$(git -C "$repo" rev-parse --short HEAD)"

          git -C "$repo" fetch origin main
          git -C "$repo" pull --ff-only origin main
          composer --working-dir="$repo" dump-autoload --classmap-authoritative
          php "$repo/bin/console" migrate
          composer --working-dir="$repo" check

          # O robô LTI MASTER usa um Chromium isolado para concluir o Deep
          # Linking sem depender de uma sessão manual no Moodle. Mantemos o
          # pacote e o navegador instalados no cache do próprio usuário da
          # aplicação; execuções futuras apenas conferem os arquivos locais.
          if [ -f "$repo/automation/package.json" ]; then
            npm --prefix "$repo/automation" install --omit=dev --no-audit --no-fund
            "$repo/automation/node_modules/.bin/playwright" install chromium
          fi

          after="$(git -C "$repo" rev-parse --short HEAD)"
          echo "Publicação concluída: $before -> $after"
          REMOTE
